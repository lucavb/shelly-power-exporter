name: Release

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Install python-semantic-release
        run: pip install python-semantic-release==10.7.0

      - name: Check main and prepare checkout
        id: candidate
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "Checkout does not match CI commit" >&2
            exit 1
          fi
          git fetch --force --prune --prune-tags origin "+refs/heads/main:refs/remotes/origin/main"
          remote_main="$(git ls-remote --heads origin refs/heads/main)"
          if [[ ! "$remote_main" =~ ^[0-9a-f]{40}[[:space:]]refs/heads/main$ ]]; then
            echo "Could not identify remote main" >&2
            exit 1
          fi
          if [[ "${remote_main%%$'\t'*}" != "$GITHUB_SHA" ]]; then
            echo "Main moved since this CI run; skipping release."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PSR requires a branch rather than a detached HEAD; retain the tested SHA.
          git switch -C main "$GITHUB_SHA"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Get exact tag before release
        if: steps.candidate.outputs.eligible == 'true'
        id: before
        run: |
          set -euo pipefail
          tags=()
          tag_list="$(git tag --points-at "$GITHUB_SHA" --list 'v*')"
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              tags+=("$tag")
            fi
          done <<< "$tag_list"
          if (( ${#tags[@]} > 1 )); then
            echo "Multiple stable tags point to the CI commit" >&2
            exit 1
          fi
          echo "tag=${tags[0]:-}" >> "$GITHUB_OUTPUT"

      - name: Semantic Release
        if: steps.candidate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --tag --vcs-release --no-commit --no-changelog --skip-build

      - name: Select and verify the new remote tag
        if: steps.candidate.outputs.eligible == 'true'
        id: after
        env:
          BEFORE_TAG: ${{ steps.before.outputs.tag }}
        run: |
          set -euo pipefail
          tags=()
          tag_list="$(git tag --points-at "$GITHUB_SHA" --list 'v*')"
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              tags+=("$tag")
            fi
          done <<< "$tag_list"
          if (( ${#tags[@]} > 1 )); then
            echo "Multiple stable tags point to the CI commit" >&2
            exit 1
          fi
          tag="${tags[0]:-}"
          if [[ -z "$tag" || "$tag" == "$BEFORE_TAG" ]]; then
            echo "No new release tag was created."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          remote_refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          direct="$(awk -F '\t' -v ref="refs/tags/$tag" '$2 == ref {print $1}' <<< "$remote_refs")"
          peeled="$(awk -F '\t' -v ref="refs/tags/$tag^{}" '$2 == ref {print $1}' <<< "$remote_refs")"
          if [[ ! "$direct" =~ ^[0-9a-f]{40}$ ]] || \
             [[ -n "$peeled" && ! "$peeled" =~ ^[0-9a-f]{40}$ ]] || \
             [[ "${peeled:-$direct}" != "$GITHUB_SHA" ]]; then
            echo "Remote tag $tag does not uniquely resolve to the CI commit" >&2
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "released=true"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.after.outputs.released == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        if: steps.after.outputs.released == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        if: steps.after.outputs.released == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.after.outputs.released == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.after.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.after.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.after.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        if: steps.after.outputs.released == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.after.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

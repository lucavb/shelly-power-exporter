name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: uv python install 3.15

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pyright
        run: uv run pyright

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build amd64 and arm64 images
        run: |
          docker buildx build --platform linux/amd64 --load -t shelly-power-exporter:amd64 .
          docker buildx build --platform linux/arm64 --load -t shelly-power-exporter:arm64 .

      - name: Smoke-test image startup and metrics endpoint
        run: |
          set -euo pipefail

          cleanup() {
            docker rm --force --time 5 shelly-power-exporter-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          smoke_test_image() {
            local image="$1"
            local container="shelly-power-exporter-smoke"
            local metrics_file="${RUNNER_TEMP}/shelly-metrics.txt"

            docker rm --force --time 5 "$container" >/dev/null 2>&1 || true
            docker run --detach \
              --name "$container" \
              --publish 127.0.0.1:19102:9102 \
              --env SHELLY_HOST=127.0.0.1 \
              --env RECONNECT_BACKOFF_SECONDS=1 \
              --env RECONNECT_BACKOFF_MAX_SECONDS=1 \
              "$image"

            for ((attempt = 1; attempt <= 30; attempt++)); do
              if ! docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null | grep -q true; then
                echo "Container exited before the metrics endpoint became ready: $image" >&2
                docker logs "$container" || true
                docker rm --force --time 5 "$container" >/dev/null 2>&1 || true
                return 1
              fi

              if curl --max-time 2 --fail --silent http://127.0.0.1:19102/metrics >"$metrics_file" \
                && grep -Fq 'shelly_target_up{target="127.0.0.1"} 0' "$metrics_file"; then
                echo "Metrics endpoint passed for $image"
                docker rm --force --time 5 "$container" >/dev/null
                return 0
              fi
              sleep 1
            done

            echo "Metrics endpoint did not become ready for $image" >&2
            docker logs "$container" || true
            docker rm --force --time 5 "$container" >/dev/null 2>&1 || true
            return 1
          }

          smoke_test_image shelly-power-exporter:amd64
          smoke_test_image shelly-power-exporter:arm64

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, docker]
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
